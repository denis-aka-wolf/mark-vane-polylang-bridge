name: Build and publish plugin release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Validate PHP syntax
        run: php -l markvane-polylang-bridge/markvane-polylang-bridge.php
      - name: Verify package contents
        run: |
          test -f markvane-polylang-bridge/LICENSE
          test -f markvane-polylang-bridge/readme.txt
          test -f markvane-polylang-bridge/CHANGELOG.md
      - name: Build installable plugin ZIP
        run: |
          mkdir -p dist
          zip -r dist/markvane-polylang-bridge-1.4.0.zip markvane-polylang-bridge
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: Mark Vane Polylang Bridge 1.4.0
          generate_release_notes: true
          files: dist/markvane-polylang-bridge-1.4.0.zip
